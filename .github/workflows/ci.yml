name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-smoke-test:
    name: Docker build smoke test — ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: simulation-api
            context: simulation-api
          - image: python-ingestor
            context: python-ingestor
          - image: data-quality
            context: data-quality
          - image: glue-trigger
            context: glue-trigger

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
