name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'simulation-api/**'
      - 'python-ingestor/**'
      - 'data-quality/**'
      - 'glue-transform/**'
      - 'glue-trigger/**'
      - 'tests/**'
      - 'pytest.ini'
      - 'requirements-dev.txt'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build-smoke-test:
    name: Docker build smoke test — ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: simulation-api
            context: simulation-api
          - image: python-ingestor
            context: python-ingestor
          - image: data-quality
            context: data-quality
          - image: glue-trigger
            context: glue-trigger

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
